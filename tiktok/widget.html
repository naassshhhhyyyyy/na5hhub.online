<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 TikTok Widget</title>
    <style>
        /* ... same CSS as before ... */
    </style>
</head>
<body>
    <div class="widget" id="widget">
        <div class="loading">🎵 Loading...</div>
    </div>

    <script>
        // ========================================
        // CONFIGURATION - Basahin ang account from URL
        // ========================================
        
        // Kunin ang account number mula sa URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const ACCOUNT = parseInt(urlParams.get('account')) || 1; // Default: 1
        
        const BASE_URL = "https://spotify-auth-g08f.onrender.com";
        
        // Gamitin ang account number sa API calls
        const SPOTIFY_API = `${BASE_URL}/api/spotify?account=${ACCOUNT}`;
        const QUEUE_API = `${BASE_URL}/api/queue?account=${ACCOUNT}`;
        
        const REFRESH_INTERVAL = 10000; // 10 seconds

        // I-display kung anong account ang gamit (optional)
        console.log(`🎵 Using Account ${ACCOUNT}`);

        let currentProgress = 0;
        let currentDuration = 0;
        let progressInterval = null;

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateProgress() {
            if (currentDuration > 0 && currentProgress < currentDuration) {
                currentProgress += 1000;
                const progressBar = document.querySelector('.progress-bar');
                if (progressBar) {
                    const percentage = Math.min((currentProgress / currentDuration) * 100, 100);
                    progressBar.style.width = percentage + '%';
                }
            }
        }

        function renderWidget(spotifyData, queueData) {
            const widget = document.getElementById('widget');
            
            if (spotifyData.error) {
                widget.innerHTML = `
                    <div class="error">
                        ❌ ${escapeHtml(spotifyData.error)}
                        <small>Retrying...</small>
                    </div>
                `;
                return;
            }

            let html = '';

            // LEFT SIDE - CURRENT SONG
            if (spotifyData.playing && spotifyData.song) {
                const current = spotifyData;
                currentDuration = current.duration_ms || 0;
                currentProgress = current.progress_ms || 0;
                const progressPercentage = currentDuration > 0 ? (currentProgress / currentDuration) * 100 : 0;
                const artistString = current.artists?.join(', ') || 'Unknown Artist';

                html += `
                    <div class="current-song">
                        ${current.albumImage ? 
                            `<img class="cover" src="${escapeHtml(current.albumImage)}" alt="${escapeHtml(current.song)}" loading="lazy">` : 
                            '<div class="cover"></div>'
                        }
                        <div class="info">
                            <div class="label">
                                <span class="playing-dot"></span> NOW PLAYING
                            </div>
                            <div class="title" title="${escapeHtml(current.song)}">${escapeHtml(current.song)}</div>
                            <div class="artist" title="${escapeHtml(artistString)}">${escapeHtml(artistString)}</div>
                            <div class="progress-wrap">
                                <div class="progress-bar" style="width: ${Math.min(progressPercentage, 100)}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="no-music">
                        <div class="icon">🎵</div>
                        <div class="info">
                            <div class="label" style="font-size:7px;text-transform:uppercase;opacity:0.4;">⏸ PAUSED</div>
                            <div class="title">Nothing playing</div>
                            <div class="artist">Waiting for music...</div>
                        </div>
                    </div>
                `;
            }

            // DIVIDER
            html += `<div class="divider"></div>`;

            // RIGHT SIDE - QUEUE
            if (queueData.queue && queueData.queue.length > 0) {
                const nextSongs = queueData.queue.slice(0, 3);
                
                html += `<div class="upcoming">`;
                html += `
                    <div class="header">
                        <span>📋 UP NEXT</span>
                        <span>${queueData.total}</span>
                    </div>
                `;
                html += `<div class="queue-scroll">`;
                nextSongs.forEach((song, index) => {
                    const artistString = song.artists?.join(', ') || 'Unknown Artist';
                    html += `
                        <div class="upcoming-song">
                            <div class="number">#${index + 1}</div>
                            ${song.albumImage ? 
                                `<img class="cover-small" src="${escapeHtml(song.albumImage)}" alt="${escapeHtml(song.song)}" loading="lazy">` : 
                                '<div class="cover-small"></div>'
                            }
                            <div class="info">
                                <div class="title" title="${escapeHtml(song.song)}">${escapeHtml(song.song)}</div>
                                <div class="artist" title="${escapeHtml(artistString)}">${escapeHtml(artistString)}</div>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            } else {
                html += `
                    <div class="upcoming">
                        <div class="header">📋 UP NEXT</div>
                        <div class="empty-state">
                            <div class="text">No songs in queue</div>
                        </div>
                    </div>
                `;
            }

            widget.innerHTML = html;

            if (spotifyData.playing) {
                if (progressInterval) clearInterval(progressInterval);
                progressInterval = setInterval(updateProgress, 1000);
            } else {
                if (progressInterval) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
            }
        }

        async function fetchData() {
            try {
                const [spotifyResponse, queueResponse] = await Promise.all([
                    fetch(SPOTIFY_API),
                    fetch(QUEUE_API)
                ]);

                if (!spotifyResponse.ok) {
                    const errorData = await spotifyResponse.json();
                    throw new Error(errorData.error || `HTTP ${spotifyResponse.status}`);
                }

                const spotifyData = await spotifyResponse.json();
                let queueData = { queue: [], total: 0 };
                
                if (queueResponse.ok) {
                    queueData = await queueResponse.json();
                }

                renderWidget(spotifyData, queueData);
            } catch (error) {
                const widget = document.getElementById('widget');
                widget.innerHTML = `
                    <div class="error">
                        ❌ Connection Error
                        <small>${escapeHtml(error.message)}</small>
                        <small>Make sure backend is running</small>
                    </div>
                `;
            }
        }

        // Initial fetch
        fetchData();
        
        // Auto-refresh every 10 seconds
        setInterval(fetchData, REFRESH_INTERVAL);
    </script>
</body>
</html>
