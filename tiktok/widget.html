<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 TikTok Widget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 6px;
            color: white;
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .widget {
            max-width: 700px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 14px;
        }

        /* LEFT SIDE - Current Song */
        .current-song {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .current-song .cover {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            object-fit: cover;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .current-song .info {
            flex: 1;
            min-width: 0;
        }

        .current-song .label {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .playing-dot {
            display: inline-block;
            width: 4px;
            height: 4px;
            background: #1DB954;
            border-radius: 50%;
            animation: pulse-dot 1.5s infinite;
        }

        .current-song .title {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-song .artist {
            font-size: 10px;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .current-song .progress-wrap {
            margin-top: 3px;
            height: 2px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            overflow: hidden;
            width: 100%;
        }

        .current-song .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #1DB954, #1ed760);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }

        /* DIVIDER */
        .divider {
            width: 1px;
            height: 50px;
            background: rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        /* RIGHT SIDE - Queue */
        .upcoming {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            min-width: 0;
        }

        .upcoming .header {
            font-size: 7px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            opacity: 0.4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .upcoming .header span {
            font-size: 7px;
            opacity: 0.4;
        }

        .upcoming-song {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 6px;
            background: rgba(255,255,255,0.03);
            border-radius: 5px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .upcoming-song .number {
            font-size: 8px;
            font-weight: 700;
            opacity: 0.3;
            min-width: 14px;
        }

        .upcoming-song .cover-small {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            object-fit: cover;
        }

        .upcoming-song .info {
            flex: 1;
            min-width: 0;
        }

        .upcoming-song .title {
            font-size: 10px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .upcoming-song .artist {
            font-size: 8px;
            opacity: 0.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .empty-state {
            text-align: center;
            padding: 6px;
            opacity: 0.4;
        }

        .empty-state .text {
            font-size: 9px;
        }

        .loading {
            text-align: center;
            padding: 12px;
            opacity: 0.4;
            font-size: 12px;
            width: 100%;
        }

        .error {
            text-align: center;
            padding: 10px;
            color: #ff6b6b;
            font-size: 11px;
            width: 100%;
        }

        .error small {
            opacity: 0.6;
            display: block;
            margin-top: 3px;
            font-size: 9px;
        }

        /* IF PAUSED / NO MUSIC */
        .no-music {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            opacity: 0.5;
        }

        .no-music .icon {
            font-size: 24px;
        }

        .no-music .info .title {
            font-size: 12px;
            font-weight: 400;
        }

        .no-music .info .artist {
            font-size: 10px;
            opacity: 0.5;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .widget {
            animation: slideIn 0.4s ease;
        }

        /* Scrollbar for queue */
        .queue-scroll {
            max-height: 70px;
            overflow-y: auto;
            padding-right: 2px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .queue-scroll::-webkit-scrollbar {
            width: 2px;
        }

        .queue-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .queue-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .widget {
                flex-direction: column;
                padding: 10px 12px;
                max-width: 400px;
            }

            .divider {
                width: 100%;
                height: 1px;
            }

            .current-song .cover {
                width: 40px;
                height: 40px;
            }

            .current-song .title {
                font-size: 12px;
            }

            .queue-scroll {
                max-height: 100px;
            }
        }

        @media (max-width: 400px) {
            .widget {
                padding: 8px 10px;
                border-radius: 8px;
            }

            .current-song .cover {
                width: 32px;
                height: 32px;
            }

            .current-song .title {
                font-size: 10px;
            }

            .current-song .artist {
                font-size: 8px;
            }

            .upcoming-song .title {
                font-size: 8px;
            }

            .upcoming-song .artist {
                font-size: 7px;
            }

            .upcoming-song .cover-small {
                width: 14px;
                height: 14px;
            }

            .queue-scroll {
                max-height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="widget" id="widget">
        <div class="loading">🎵 Loading...</div>
    </div>

    <script>
        // ========================================
        // CONFIGURATION
        // ========================================
        
        const API_URL = "https://spotify-auth-g08f.onrender.com/api/tiktok-widget?account=1";
        const REFRESH_INTERVAL = 5000;

        let currentProgress = 0;
        let currentDuration = 0;
        let progressInterval = null;

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function updateProgress() {
            if (currentDuration > 0 && currentProgress < currentDuration) {
                currentProgress += 1000;
                const progressBar = document.querySelector('.progress-bar');
                if (progressBar) {
                    const percentage = Math.min((currentProgress / currentDuration) * 100, 100);
                    progressBar.style.width = percentage + '%';
                }
            }
        }

        function renderWidget(data) {
            const widget = document.getElementById('widget');
            
            if (data.error) {
                widget.innerHTML = `
                    <div class="error">
                        ❌ ${escapeHtml(data.error)}
                        <small>Retrying...</small>
                    </div>
                `;
                return;
            }

            let html = '';

            // ========================================
            // LEFT SIDE - CURRENT SONG
            // ========================================
            
            if (data.current && data.isPlaying) {
                const current = data.current;
                currentDuration = current.duration_ms || 0;
                currentProgress = current.progress_ms || 0;
                const progressPercentage = currentDuration > 0 ? (currentProgress / currentDuration) * 100 : 0;

                html += `
                    <div class="current-song">
                        ${current.albumImage ? 
                            `<img class="cover" src="${escapeHtml(current.albumImage)}" alt="${escapeHtml(current.song)}" loading="lazy">` : 
                            '<div class="cover"></div>'
                        }
                        <div class="info">
                            <div class="label">
                                <span class="playing-dot"></span> NOW PLAYING
                            </div>
                            <div class="title" title="${escapeHtml(current.song)}">${escapeHtml(current.song)}</div>
                            <div class="artist" title="${escapeHtml(current.artistString)}">${escapeHtml(current.artistString)}</div>
                            <div class="progress-wrap">
                                <div class="progress-bar" style="width: ${Math.min(progressPercentage, 100)}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="no-music">
                        <div class="icon">🎵</div>
                        <div class="info">
                            <div class="label" style="font-size:7px;text-transform:uppercase;opacity:0.4;">⏸ PAUSED</div>
                            <div class="title">Nothing playing</div>
                            <div class="artist">Waiting for music...</div>
                        </div>
                    </div>
                `;
            }

            // ========================================
            // DIVIDER
            // ========================================
            
            html += `<div class="divider"></div>`;

            // ========================================
            // RIGHT SIDE - QUEUE
            // ========================================
            
            if (data.next && data.next.length > 0) {
                html += `<div class="upcoming">`;
                html += `
                    <div class="header">
                        <span>📋 UP NEXT</span>
                        <span>${data.queueLength}</span>
                    </div>
                `;
                html += `<div class="queue-scroll">`;
                data.next.forEach((song, index) => {
                    html += `
                        <div class="upcoming-song">
                            <div class="number">#${index + 1}</div>
                            ${song.albumImage ? 
                                `<img class="cover-small" src="${escapeHtml(song.albumImage)}" alt="${escapeHtml(song.song)}" loading="lazy">` : 
                                '<div class="cover-small"></div>'
                            }
                            <div class="info">
                                <div class="title" title="${escapeHtml(song.song)}">${escapeHtml(song.song)}</div>
                                <div class="artist" title="${escapeHtml(song.artistString)}">${escapeHtml(song.artistString)}</div>
                            </div>
                        </div>
                    `;
                });
                html += `</div></div>`;
            } else {
                html += `
                    <div class="upcoming">
                        <div class="header">📋 UP NEXT</div>
                        <div class="empty-state">
                            <div class="text">No songs in queue</div>
                        </div>
                    </div>
                `;
            }

            widget.innerHTML = html;

            if (data.current && data.isPlaying) {
                if (progressInterval) clearInterval(progressInterval);
                progressInterval = setInterval(updateProgress, 1000);
            } else {
                if (progressInterval) {
                    clearInterval(progressInterval);
                    progressInterval = null;
                }
            }
        }

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }
                const data = await response.json();
                renderWidget(data);
            } catch (error) {
                const widget = document.getElementById('widget');
                widget.innerHTML = `
                    <div class="error">
                        ❌ Connection Error
                        <small>${escapeHtml(error.message)}</small>
                    </div>
                `;
            }
        }

        fetchData();
        setInterval(fetchData, REFRESH_INTERVAL);
    </script>
</body>
</html>
